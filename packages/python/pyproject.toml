[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "toolguard"
version = "0.1.0"
description = "Python client for ToolGuard: human approval and an audit log for AI agent tool calls."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Vishut Dhar" }]
keywords = ["ai-agents", "human-in-the-loop", "audit-log", "langchain", "tool-authorization"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.24,<1",
  "typing_extensions>=4.7; python_version < '3.11'",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.2"]
dev = [
  "pytest>=7",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "mypy>=1.8",
  "ruff>=0.4",
  "langchain-core>=0.2",
]

[project.urls]
Homepage = "https://github.com/vishutdhar/toolguard"
Source = "https://github.com/vishutdhar/toolguard/tree/master/packages/python"

[tool.hatch.build.targets.wheel]
packages = ["src/toolguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: needs a built ToolGuard server (node dist/src/server.js)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/toolguard"]
